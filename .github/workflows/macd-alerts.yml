
name: BingX MACD Zero Line Scanner (Windows)

on:
  schedule:
    - cron: '2-59/5 * * * *'

  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Reset BingX MACD checkpoints'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bingx-macd-zero-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify locally installed Python 3.12
        run: |
          py -3.12 --version

          if ($LASTEXITCODE -ne 0) {
            throw 'Python 3.12 is not installed.'
          }

      - name: Set BingX persistent checkpoint
        env:
          RESET_STATE: ${{ inputs.reset_state }}
        run: |
          $stateDir = Join-Path $env:USERPROFILE 'bingx-macd-state'
          New-Item -ItemType Directory -Path $stateDir -Force | Out-Null

          $stateFile = Join-Path $stateDir 'state.json'

          if ($env:RESET_STATE -eq 'true' -and (Test-Path $stateFile)) {
            Remove-Item -Path $stateFile -Force
            Write-Host 'BingX checkpoints reset.'
          }

          "STATE_PATH=$stateFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Checkpoint: $stateFile"

      - name: Scan BingX MACD and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINGX_REQUESTS_PER_SECOND: '1'
          MAX_WORKERS: '6'

        run: |
          py -3.12 scanner.py

          if ($LASTEXITCODE -ne 0) {
            throw 'BingX MACD scanner failed.'
          }
