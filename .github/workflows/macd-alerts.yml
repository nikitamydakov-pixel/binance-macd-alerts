name: BingX MACD Chart Alerts (Windows)

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Reset BingX MACD checkpoints (not recommended for normal updates)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bingx-macd-zero-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python 3.12
        run: |
          py -3.12 --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 not found' }

      - name: Ensure matplotlib is installed
        run: |
          py -3.12 -c "import matplotlib; print(matplotlib.__version__)"
          if ($LASTEXITCODE -ne 0) {
            py -3.12 -m pip install --disable-pip-version-check "matplotlib>=3.8,<4"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install matplotlib' }
          }

      - name: Set persistent BingX checkpoint
        env:
          RESET_STATE: ${{ inputs.reset_state }}
        run: |
          $dir = Join-Path $env:USERPROFILE 'bingx-macd-state'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $stateFile = Join-Path $dir 'state.json'
          if ($env:RESET_STATE -eq 'true' -and (Test-Path $stateFile)) {
            Remove-Item -Path $stateFile -Force
          }
          "STATE_PATH=$stateFile" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Checkpoint location: $stateFile"

      - name: Scan BingX and send Telegram chart photos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINGX_REQUESTS_PER_SECOND: '1'
          MAX_WORKERS: '6'
          MPLBACKEND: 'Agg'
        run: |
          py -3.12 scanner.py
          if ($LASTEXITCODE -ne 0) { throw 'BingX MACD scanner failed' }
