name: Bybit MACD Zero Line Scanner

on:
  schedule:
    # :02, :07, :12, :17 ... UTC. GitHub can delay or occasionally skip runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      reset_state:
        description: 'Start fresh Bybit checkpoints (no historical Telegram signals)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: bybit-macd-zero-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore last Bybit checkpoint
        if: ${{ !inputs.reset_state }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .state
          # Dedicated artifact name: NEVER read older Binance checkpoints.
          run_ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=bybit-macd-state-v1&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id')
          if [ -z "$run_ids" ]; then
            echo "No existing Bybit state: initial synchronization"
            exit 0
          fi
          for run_id in $run_ids; do
            if gh run download "$run_id" --name bybit-macd-state-v1 --dir .state > /dev/null 2>&1 \
                 && [ -s .state/state.json ]; then
              echo "Bybit state restored from workflow run $run_id"
              exit 0
            fi
          done
          echo "ERROR: Bybit checkpoint exists but could not be downloaded." >&2
          echo "Fix artifact permissions, or manually run with reset_state=true." >&2
          exit 1

      - name: Scan Bybit MACD and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_REQUESTS_PER_SECOND: '7'
          MAX_WORKERS: '8'
          STATE_PATH: .state/state.json
        run: python scanner.py

      - name: Save Bybit checkpoint for next run
        uses: actions/upload-artifact@v4
        with:
          name: bybit-macd-state-v1
          path: .state/state.json
          if-no-files-found: error
          retention-days: 30
